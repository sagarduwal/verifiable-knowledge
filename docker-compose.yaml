version: '3.8'

services:
  neo4j:
    image: neo4j:latest
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/60beZCZ7C17L"  # Use the credentials from .env

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"

  kgagent:
    build:
      context: ./kg-agent
    container_name: kgagent
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      - neo4j
      - qdrant
    environment:
      VDB_URL: "http://qdrant:6333"
      GDB_URL: "bolt://neo4j:7687"
      GDB_USERNAME: "neo4j"
      GDB_PASSWORD: "60beZCZ7C17L"  # Use the credentials from .env

